<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — ParkEase</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #E9E3D6;
      color: #212420;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background-color: #E9E3D6;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 8px 8px 18px #CFC8B8, -8px -8px 18px #FFFDF8;
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-weight: 700;
      font-size: 18px;
      color: #1D4A35;
    }
    .logo-tile {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background-color: #1D4A35;
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 26px;
      color: #1D4A35;
      padding-bottom: 10px;
      border-bottom: 2px dashed #E6B422;
    }
    p {
      margin: 0 0 24px 0;
      font-size: 15px;
      line-height: 1.5;
      color: #4A4F48;
    }
    .btn {
      display: inline-block;
      background-color: #1D4A35;
      color: #FFFFFF;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 4px 4px 10px #CFC8B8, -4px -4px 10px #FFFDF8;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="logo-tile">P</span>
      <span>ParkEase</span>
    </div>
    <h1>404 — Page Not Found</h1>
    <p>The page you requested does not exist or may have moved.</p>
    <a class="btn" href="/">Return to Home</a>
  </main>
</body>
</html>
